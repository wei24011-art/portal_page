<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
            display: grid;
            grid-template-columns: 1.5fr 1fr 1.5fr;
            grid-template-rows: 50px;
        }


        #formContainer {
            background-color: white;
            grid-row: 2;
            grid-column: 2;
            min-width: 0;
            display: grid;
            border: 10px solid rgb(37, 37, 132);
            border-radius: 30px;
            background-image: url(images/jesus_feeds_5000.jpeg);
            background-size: contain;
            grid-template-rows: 150px 300px 120px;
        }

        #closeBtn {
            grid-row: 1;
            grid-column: 1;
            width: 20px;
            height: 20px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px black;
            grid-row: 1;
            grid-column: 1;
            text-align: center;
            margin-top: 70px;
        }

        h2 {
            color: white;
            text-shadow: 2px 2px black;
            grid-row: 1;
            grid-column: 1;
            text-align: center;
            margin-top: 100px;
        }

        h3 {
            grid-row: 2;
            grid-column: 1;
            z-index: 2;
            background-color: white;
            text-align: center;
            padding-top: 15px;
        }

        #myForm {
            margin-top: 60px;
            background-color: white;
            grid-row: 2;
            grid-column: 1;
            z-index: 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            text-align: center;
        }

        #scriptures {
            background-color: white;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            height: 100%;
            border-radius: 30px;
        }

        img {
            width: 100%;
        }

        #newsletter-section {
            grid-row: 5;
            grid-column: 1 / 3;
        }

        #conditions-section {
            grid-row: 6;
            grid-column: 1 / 3;
        }

        #submit-button {
            grid-row: 7;
            grid-column: 1 / 3;
        }



    </style>




</head>

<body>
    <div id="formContainer">
        <button type="button" id="closeBtn">X</button>
        <h1>Daily Feed</h1>
        <h2>Scripture a Day</h2>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section id="newsletter-section">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section id="conditions-section">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section id="submit-button">
                <button type="submit">Submit</button>
            </section>
        </form>

        <div id="scriptures">
            <img src="images/old_testament.webp">
            <img src="images/new_testament.webp">
            <img src="images/book_of_mormon.webp">
            <img src="images/doctrine_and_covenants.webp">
            <img src="images/pearl_of_great_price.webp">
        </div>


    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
